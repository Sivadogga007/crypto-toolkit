name: CI & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  python-test:
    name: Python Test Matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy hypothesis
      - name: Run Pytest with Coverage
        run: PYTHONPATH=. pytest --cov=crypto_toolkit tests/
      - name: Static Analysis
        run: |
          ruff check crypto_toolkit/ tests/ || true
          mypy crypto_toolkit/ || true
